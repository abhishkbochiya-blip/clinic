<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* --- БАЗОВЫЕ СТИЛИ --- */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; transition: background 0.3s, color 0.3s; }
    body { color: #ffffff; line-height: 1.6; background-color: #050b14; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 10; }

    /* --- АНИМИРОВАННЫЙ ЖИВОЙ ФОН --- */
    .bg-animation { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; background: #050b14; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; transition: transform 0.5s ease-out; }
    .orb-1 { width: 500px; height: 500px; background: #0f5c53; top: -100px; left: -100px; transform: translate(var(--mx, 0), var(--my, 0)); }
    .orb-2 { width: 600px; height: 600px; background: #0b3954; bottom: -150px; right: -100px; transform: translate(calc(var(--mx, 0) * -1.5), calc(var(--my, 0) * -1.5)); }
    .orb-3 { width: 400px; height: 400px; background: #144f43; top: 40%; left: 30%; transform: translate(calc(var(--mx, 0) * 0.8), calc(var(--my, 0) * 0.8)); opacity: 0.3; }

    /* --- СТИЛЬ МАТОВОГО СТЕКЛА --- */
    .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); }

    /* --- КНОПКИ --- */
    .btn { display: inline-block; padding: 16px 36px; background: linear-gradient(135deg, #188a83, #11625d); color: #ffffff; font-size: 14px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; border: none; border-radius: 50px; transition: all 0.3s ease; cursor: pointer; text-align: center; }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(17, 98, 93, 0.4); }
    .btn-outline { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: none; }
    .btn-outline:hover { background: rgba(255, 255, 255, 0.1); border-color: #ffffff; }

    /* --- УМНАЯ ШАПКА --- */
    header { padding: 20px 0; position: fixed; top: 0; left: 0; width: 100%; z-index: 100; transition: transform 0.4s ease; }
    header.hidden { transform: translateY(-100%); }
    .header-content { display: flex; justify-content: space-between; align-items: center; background: rgba(10, 15, 20, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); padding: 15px 30px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); flex-wrap: wrap; gap: 10px; }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .logo span { color: #2acfc4; }
    nav ul { display: flex; list-style: none; gap: 30px; align-items: center; }
    nav a { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.7); transition: color 0.3s; }
    nav a:hover { color: #ffffff; }
    .header-phone { font-weight: 600; font-size: 15px; letter-spacing: 1px; }

    /* Кнопка версии для слабовидящих */
    .a11y-btn { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .a11y-btn:hover { background: rgba(255,255,255,0.1); }

    /* --- SCROLL REVEAL (Анимация появления) --- */
    .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s ease-out; }
    .reveal.active { opacity: 1; transform: translateY(0); }

    /* --- ГЛАВНЫЙ ЭКРАН --- */
    .hero { padding: 150px 0 100px; min-height: 100vh; display: flex; align-items: center; }
    .hero-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 60px; align-items: center; }
    .hero-text h1 { font-size: 52px; font-weight: 300; line-height: 1.15; margin-bottom: 30px; }
    .hero-text h1 strong { font-weight: 700; background: linear-gradient(to right, #ffffff, #2acfc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero-text p { font-size: 17px; color: rgba(255, 255, 255, 0.7); margin-bottom: 40px; font-weight: 300; max-width: 480px; }

    /* --- ПРЕИМУЩЕСТВА --- */
    .features { padding: 80px 0; }
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
    .features .glass-panel { transition: transform 0.3s ease; }
    .features .glass-panel:hover { transform: translateY(-10px); }
    .feature-icon { font-size: 30px; margin-bottom: 20px; color: #2acfc4; }

    /* --- ИНТЕРАКТИВ ДО / ПОСЛЕ --- */
    .portfolio { padding: 80px 0; text-align: center; }
    .section-title { margin-bottom: 50px; text-align: center; }
    .section-title h2 { font-size: 36px; font-weight: 300; }
